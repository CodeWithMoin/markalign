name: Supabase keep-alive
# Free-tier Supabase pauses a project after 7 days without activity; ping it twice a week.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write  # re-enable self: GitHub disables schedules after 60 days of no commits

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          h=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          retry=(--retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30)
          # 1) key check: auth settings is readable with any valid anon key
          curl -fsS "${retry[@]}" -o /dev/null -w "auth HTTP %{http_code}\n" "${h[@]}" "${SUPABASE_URL%/}/auth/v1/settings"
          # 2) activity: hit PostgREST; anon can't read the root, a 404 for a missing table is fine
          code=$(curl -sS "${retry[@]}" -o /dev/null -w "%{http_code}" "${h[@]}" "${SUPABASE_URL%/}/rest/v1/keepalive?select=*")
          echo "rest HTTP $code"
          [ "$code" != 401 ] && [ "$code" -lt 500 ]
      - name: Keep this schedule from being auto-disabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
